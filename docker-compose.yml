services:
  nextjs-app:
    build: 
      context: .
      args:
        - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
        - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL}
    container_name: nextjs-portfolio
    networks:
      - web-gateway
    expose:
      - "3000"
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL}


networks:
  web-gateway:
    external: true